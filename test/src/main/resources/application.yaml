quarkus:
    http:
        host-enabled: true
        ## plain HTTP is only enabled for the mock servers (registry, deployer), which installrd calls itself;
        ## the installrd API requires an authenticated client certificate on the HTTPS port
        port: 9321
        test-port: 9321
        ssl-port: 9322
        test-ssl-port: 9322
        insecure-requests: enabled
        auth:
            permission:
                "mocks":
                    paths: /repositories/*,/deployer-mock/*,/test/*
                    policy: permit
        access-log:
            enabled: true

    ## client certificate of the test admin, used by InstallrClient
    tls:
        "admin-client":
            key-store:
                pem:
                    "admin":
                        cert: certs/admin.crt
                        key: certs/admin.key
            trust-store:
                pem:
                    certs: certs/ca.crt

    rest-client:
        "installrd":
            url: https://localhost:9322
            tls-configuration-name: admin-client

    log:
        level: WARN
        console:
            stderr: true
            enabled: true
        handler:
            console:
                "access-log-handler":
                    format: "%s%n"
                    stderr: false
        category:
            "io.quarkus.http.access-log":
                level: INFO
                handlers: access-log-handler
                use-parent-handlers: false
            "io.installr":
                level: TRACE
                min-level: TRACE

    package:
        main-class: TestMain
        jar:
            type: FAST_JAR

    datasource:
        db-kind: h2
        credentials-provider: installrd-database
        credentials-provider-name: installrd-database
        jdbc:
            ## located in the config location, so the H2 TCP listener (baseDir = config location) can serve it
            url: jdbc:h2:${installrd.config.location}/installrd;DB_CLOSE_ON_EXIT=FALSE

    liquibase:
        migrate-at-start: true

    hibernate-orm:
        schema-management:
            strategy: validate
        mapping:
            format:
                global: IGNORE

    index-dependency:
        installrd:
            group-id: "io.installr"
            artifact-id: "installrd"
        lib-installrd:
            group-id: "io.installr"
            artifact-id: "installr-lib-installrd"
        lib-registry:
            group-id: "io.installr"
            artifact-id: "installr-lib-registry"

installrd:
    config:
        location: ./target/classes/test-config
    database-listener:
        enabled: true
        port: 9421
