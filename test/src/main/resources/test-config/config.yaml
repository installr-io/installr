##
## Installr Daemon Test Configuration
##
package-cache:
    directory: ${installrd.config.location}/.pkg-cache
    expires-after: 0s

deployer:
    "application/vnd.io.installr.*":
        type: NoOpDeployer

    "application/vnd.io.installr.liquibase":
        type: LiquibaseDeployer
        config:
            url: "jdbc:h2:mem:liquibase_it;DB_CLOSE_DELAY=-1"
            ## username and password configured per package

    "application/vnd.io.installr.http-test":
        type: HttpDeployer
        config:
            url: http://localhost:9321/deployer-mock
            auth:
                type: api-key
                key-name: "x-auth-token"
                value-provider:
                    type: "header-value"
                    header-name: "x-auth-token"

    "application/vnd.io.installr.kubernetes":
        type: KubernetesDeployer

    "application/vnd.io.installr.docker-stack":
        type: DockerStackDeployer

    "application/vnd.io.installr.docker-network":
        type: DockerNetworkDeployer

repositories:
    - id: test-repository
      name: "Pretty name for test-repository"
      url: http://localhost:9321/repositories/test-repository
      enabled: true

namespaces:
    - name: Namespace1
    - name: Namespace2

security:
    admins:
        - "CN=admin,O=installr-test"
    roles:
        - name: developer
          operations: [ "pkg:install", "pkg:reinstall", "pkg:read", "tx:*", "ns:read" ]
        - name: viewer
          operations: [ "ns:read", "pkg:read", "tx:read" ]
        - name: ns-manager
          operations: [ "ns:create", "ns:delete" ]
        ## global operations are ignored in namespace bindings
        - name: sneaky
          operations: [ "ns:read", "daemon:stop", "ns:create" ]
    bindings:
        - subject: "CN=ops,O=installr-test"
          roles: [ ns-manager ]
