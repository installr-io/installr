version: "3.8"

services:
    test-srv-1:
        image: nginx:1.29
        deploy:
            replicas: 1
            restart_policy:
                condition: none
        environment:
            - NGINX_PORT=8080
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080"]
            interval: 1s
            timeout: 1s
            retries: 1
    test-srv-2:
        image: nginx:1.29
        deploy:
            replicas: 1
            restart_policy:
                condition: none
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost"]
            interval: 1s
            timeout: 1s
            retries: 1
