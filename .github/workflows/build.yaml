name: Build installr/d

on:
    push:
        branches: ["main"]
    
    pull_request:
        branches: ["main"]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: Setup docker swarm
              run: docker swarm init

            - name: Build
              run: mvn -B clean install
